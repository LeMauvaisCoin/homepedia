name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Dépendances JavaScript
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Code et dépendances inutilisés
        run: bun run knip --reporter github-actions

  check:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        run: bunx commitlint --verbose --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

      - name: Formatage (Oxfmt et Ruff)
        run: bun run format:check

      - name: Lint typé, typecheck et tests unitaires
        run: bun run check

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: http://localhost:8000

  e2e:
    name: Intégration et E2E sur le jeu d'exemple
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Base locale reconstruite depuis les migrations et le seed
        run: bunx supabase db start --workdir .

      - name: Lint du schéma SQL
        run: bun run supabase:lint

      - name: Tables SQLAlchemy, contrat OpenAPI et client TypeScript à jour
        run: bun run generate:check
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres

      - name: Tests d'intégration de l'API
        run: bun run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres

      - name: Version de Playwright
        id: playwright
        working-directory: apps/web
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Navigateur et dépendances système
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Scénarios Playwright
        run: bun run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Arrêt de la base locale
        if: always()
        run: bun run supabase:stop
