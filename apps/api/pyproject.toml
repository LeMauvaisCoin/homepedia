[project]
name = "homepedia-api"
version = "0.0.0"
description = "API HTTP de Homepedia (FastAPI)."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141.1",
  "geoalchemy2>=0.20.0",
  "psycopg[binary]>=3.3.5",
  "pydantic-settings>=2.15.0",
  "sqlalchemy[asyncio]>=2.0.54",
  "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "homepedia_api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: nécessite la base Supabase locale (bun run supabase:start)",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.0",
  "pytest>=9.1.1",
  "ruff>=0.16.8",
  "sqlacodegen>=3",
  "ty>=0.0.82",
]
