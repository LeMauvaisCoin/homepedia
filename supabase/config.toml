# Homepedia's Supabase configuration. Key reference:
# https://supabase.com/docs/guides/local-development/cli/config
#
# Only the FastAPI API talks to PostgreSQL: the services exposed to the browser
# (Data API, Auth, Realtime, Storage, Edge Functions) stay disabled.
# The 5532x ports avoid collisions with other local Supabase stacks.
project_id = "homepedia"

[api]
enabled = false
port = 55321

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Example data: local only, never pushed to production.
enabled = true
sql_paths = ["./seeds/*.sql"]

[studio]
enabled = true
port = 55323

[realtime]
enabled = false

[storage]
enabled = false

[auth]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[local_smtp]
enabled = false
