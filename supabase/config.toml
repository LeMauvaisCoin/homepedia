# Configuration Supabase de Homepedia. Référence des clés :
# https://supabase.com/docs/guides/local-development/cli/config
#
# Seule l'API FastAPI parle à PostgreSQL : les services exposés au navigateur
# (Data API, Auth, Realtime, Storage, Edge Functions) restent désactivés.
# Les ports 5532x évitent les collisions avec d'autres piles Supabase locales.
project_id = "homepedia"

[api]
enabled = false
port = 55321

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Données d'exemple : locales uniquement, jamais poussées en production.
enabled = true
sql_paths = ["./seeds/*.sql"]

[studio]
enabled = true
port = 55323

[realtime]
enabled = false

[storage]
enabled = false

[auth]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[local_smtp]
enabled = false
